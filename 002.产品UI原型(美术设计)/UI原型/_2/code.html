<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        /* Liubai Brush Stroke Effect */
        .brush-divider {
            height: 2px;
            background: linear-gradient(90deg, transparent 0%, #D4CCBC 50%, transparent 100%);
            mask-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 100 2" xmlns="http://www.w3.org/2000/svg"><path d="M0 1 C 20 0, 80 2, 100 1" stroke="black" stroke-width="2" fill="none"/></svg>');
            width: 100%;
        }

        .xuan-paper {
            background-color: #F5F0E8;
            background-image: url("https://www.transparenttextures.com/patterns/natural-paper.png");
        }

        input:focus {
            outline: none;
            box-shadow: none;
        }

        .ink-transition {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Custom Checkbox Style */
        .ink-checkbox {
            appearance: none;
            width: 18px;
            height: 18px;
            border: 1px solid #747878;
            border-radius: 2px;
            background-color: transparent;
            display: grid;
            place-content: center;
            cursor: pointer;
        }

        .ink-checkbox:checked {
            background-color: #000;
            border-color: #000;
        }

        .ink-checkbox:checked::before {
            content: "";
            width: 10px;
            height: 10px;
            transform: scale(1);
            background-color: white;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }
    </style>
</head>
<body class="xuan-paper text-on-background min-h-screen flex flex-col font-body-lg text-body-lg selection:bg-ink-wash-gray selection:text-primary">
<main class="flex-grow flex flex-col items-center justify-center px-container-margin py-section-gap">
<div class="w-full max-w-sm flex flex-col items-center animate-fade-in">
<!-- Centered Logo & Branding -->
<div class="mb-section-gap text-center">
<div class="mb-4 inline-block">
<img alt="留白记账 Logo" class="w-32 h-32 object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDuT2qaNeaCYp6sOHBMPp5o62yFcSaq_FQC2FlKdGTylXpCp1z2nz0xzjXueV40Js6uyVUvscCLzusKxlrryjOyrS9tz2XMcMpAA-LebscjyWVdHZP6RgMEpR3Se_SeKv3e6_iPxyTkgDa7RS_xYlIPx8KBIu3ArFxmSFQEFyA2EUkXzaH1FU20UQwB80WoyHJ6Z7RhX2hUQT16oAz_oLeuc7BOaTQEpsVkfbzEe1ynd2fB0iDE0fjuUA">
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tight">
                留白记账
            </h1>
<p class="font-body-sm text-body-sm text-pale-ink mt-2 italic">
                记账，是一种生活的修行。
            </p>
</div>
<!-- Login Form -->
<form class="w-full space-y-gutter">
<!-- Username -->
<div class="relative group">
<label class="font-label-caps text-label-caps text-pale-ink block mb-1" for="username">手机号</label>
<input class="w-full bg-transparent border-t-0 border-x-0 border-b border-ink-wash-gray focus:border-b-2 focus:border-slate-blue focus:ring-0 py-2 px-0 font-body-lg text-body-lg ink-transition placeholder:text-outline-variant" id="username" placeholder="请输入手机号" required="" type="text">
</div>
<!-- Password -->
<div class="relative group">
<div class="flex justify-between items-end mb-1">
<label class="font-label-caps text-label-caps text-pale-ink block" for="password">密码</label>
</div>
<input class="w-full bg-transparent border-t-0 border-x-0 border-b border-ink-wash-gray focus:border-b-2 focus:border-slate-blue focus:ring-0 py-2 px-0 font-body-lg text-body-lg ink-transition placeholder:text-outline-variant" id="password" placeholder="请输入密码" required="" type="password">
</div>
<!-- Remember Me & Forgot Password -->
<div class="flex items-center justify-between py-2">
<label class="flex items-center gap-2 cursor-pointer group">
<input class="ink-checkbox ink-transition" type="checkbox">
<span class="font-body-sm text-body-sm text-on-surface-variant group-hover:text-primary transition-colors">记住登录状态</span>
</label>
<a class="font-body-sm text-body-sm text-slate-blue hover:opacity-80 transition-opacity" href="#">忘记密码？</a>
</div>
<!-- Login Button -->
<div class="pt-4">
<button class="w-full bg-primary text-on-primary py-4 font-label-caps text-label-caps tracking-[0.2em] uppercase ink-transition active:scale-[0.98] hover:bg-opacity-90 border border-primary" type="submit">
                    登 录
                </button>
</div>
</form>
<!-- Secondary Actions -->
<div class="mt-section-gap w-full">
<div class="brush-divider mb-8"></div>
<div class="text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant mb-4">初识留白？</p>
<a class="inline-block px-8 py-3 border border-primary text-primary font-label-caps text-label-caps tracking-[0.15em] uppercase hover:bg-surface-container-low transition-colors" href="#">
                    注 册 账 号
                </a>
</div>
</div>
</div>
</main>
<!-- Background Atmospheric micro-interaction -->
<div class="fixed bottom-0 left-0 w-full opacity-10 pointer-events-none select-none overflow-hidden h-64">
<svg class="w-full h-full fill-ink-wash-gray" preserveAspectRatio="none" viewBox="0 0 1000 100">
<path d="M0,50 Q250,10 500,50 T1000,50 L1000,100 L0,100 Z" opacity="0.3"></path>
<path d="M0,70 Q300,30 600,70 T1000,70 L1000,100 L0,100 Z" opacity="0.5"></path>
</svg>
</div>
<script>
    // Simple form interaction
    document.querySelector('form').addEventListener('submit', (e) => {
        e.preventDefault();
        const btn = e.target.querySelector('button');
        const originalText = btn.innerText;
        
        btn.disabled = true;
        btn.innerText = "正在验证...";
        
        setTimeout(() => {
            btn.innerText = "欢迎回来";
            btn.classList.remove('bg-primary');
            btn.classList.add('bg-pine-green', 'border-pine-green');
            
            setTimeout(() => {
                btn.disabled = false;
                btn.innerText = originalText;
                btn.classList.add('bg-primary');
                btn.classList.remove('bg-pine-green', 'border-pine-green');
            }, 2000);
        }, 1200);
    });

    const inputs = document.querySelectorAll('input');
    inputs.forEach(input => {
        input.addEventListener('focus', () => {
            document.body.style.backgroundColor = '#FAF7F2';
        });
        input.addEventListener('blur', () => {
            document.body.style.backgroundColor = '#F5F0E8';
        });
    });
</script>


</body></html>
