<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>留白记账 · 我的</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: 'Noto Serif SC', serif; background: #f5f0e8; }

    .page {
      position: relative;
      min-height: 100vh;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      background: #f5f0e8;
      display: flex;
      flex-direction: column;
      padding-bottom: 80px;
    }

    /* Background texture */
    .page::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url('assets/page-texture.png');
      background-size: 523px 384px;
      background-position: top left;
      opacity: .03;
      pointer-events: none;
      z-index: 0;
    }

    /* ── Header ── */
    .header {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 64px;
      backdrop-filter: blur(6px);
      background: rgba(253,248,248,.8);
    }
    .header-title {
      font-size: 24px; font-weight: 700;
      color: #000; letter-spacing: 2.4px; line-height: 32px;
    }

    /* ── Main content ── */
    .main {
      position: relative;
      z-index: 1;
      flex: 1;
      padding: 96px 24px 128px;
      max-width: 672px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 40px;
    }

    /* ── Profile header ── */
    .profile-header {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 32px;
    }

    /* Avatar */
    .avatar-wrap {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
    }
    .avatar {
      width: 96px; height: 96px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 20px 0 rgba(26,26,26,.05);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .avatar img {
      width: 183.5%;
      height: 100%;
      object-fit: cover;
      margin-left: -41.76%;
    }
    /* Decorative seal */
    .avatar-seal {
      position: absolute;
      bottom: -8px; right: -8px;
      width: 32px; height: 32px;
    }

    /* Name & tagline */
    .profile-info {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-top: 108px; /* below avatar */
    }
    .profile-name {
      font-size: 28px; font-weight: 700;
      color: #000; letter-spacing: -0.56px; line-height: 36px;
    }
    .profile-tagline {
      font-size: 13px; font-weight: 400;
      color: #6b6b6b; line-height: 20px;
    }

    /* Monthly stats */
    .stats-row {
      display: flex;
      gap: 16px;
      margin-top: 24px;
      width: 100%;
    }
    .stat-card {
      flex: 1;
      background: #fff;
      border: 1px solid rgba(212,204,188,.2);
      border-radius: 8px;
      padding: 25px;
      box-shadow: 0 4px 10px rgba(26,26,26,.05);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .stat-label {
      font-size: 11px; font-weight: 500;
      color: #6b6b6b; letter-spacing: 1.1px; line-height: 16px;
    }
    .stat-amount {
      font-family: 'Hanken Grotesk', sans-serif;
      font-size: 32px; font-weight: 600;
      letter-spacing: 1.6px; line-height: 40px;
    }
    .stat-amount.income { color: #2e7d5e; }
    .stat-amount.expense { color: #c0392b; }

    /* Settings section */
    .settings-section { display: flex; flex-direction: column; gap: 16px; }
    .settings-heading {
      font-size: 11px; font-weight: 500;
      color: #6b6b6b; letter-spacing: 1.1px; line-height: 16px;
      padding-left: 8px;
    }
    .settings-card {
      background: #fff;
      border: 1px solid rgba(212,204,188,.1);
      border-radius: 8px;
      box-shadow: 0 4px 20px 0 rgba(26,26,26,.05);
      overflow: hidden;
    }
    .settings-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px;
      cursor: pointer;
    }
    .settings-item:hover { background: #faf7f2; }
    .settings-item:active { background: #f0ebe5; }
    .settings-left {
      display: flex; align-items: center; gap: 16px;
    }
    .settings-icon {
      width: 40px; height: 40px;
      background: #e7e2da;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
    }
    .settings-icon img { object-fit: contain; }
    .settings-name {
      font-size: 16px; font-weight: 400;
      color: #1c1b1b; line-height: 24px;
    }
    .settings-chevron { width: 7.4px; height: 12px; object-fit: contain; }
    .settings-divider {
      height: 1px;
      background: rgba(212,204,188,.2);
      margin: 0 20px;
    }

    /* Logout section */
    .logout-section {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 16px;
    }
    .logout-divider {
      height: 1px;
      background: linear-gradient(90deg,
        rgba(212,204,188,0) 0%,
        rgba(212,204,188,1) 20%,
        rgba(212,204,188,1) 80%,
        rgba(212,204,188,0) 100%);
      opacity: .6;
    }
    .logout-btn-wrap {
      display: flex;
      justify-content: center;
      padding-top: 16px;
    }
    .logout-btn {
      position: relative;
      border: 1px solid rgba(192,57,43,.3);
      border-radius: 12px;
      padding: 13px 49px;
      cursor: pointer;
      background: transparent;
    }
    .logout-btn:hover { background: rgba(192,57,43,.03); }
    .logout-btn:active { background: rgba(192,57,43,.06); }
    .logout-text {
      font-size: 16px; font-weight: 400;
      color: #c0392b; line-height: 24px;
    }
    .logout-underline {
      position: absolute;
      bottom: 4px; left: 50%; transform: translateX(-50%);
      width: 80px; height: 8px;
      object-fit: contain;
    }
    .version-text {
      text-align: center;
      font-family: 'Hanken Grotesk', sans-serif;
      font-size: 11px; font-weight: 700;
      color: #c4c7c7; letter-spacing: 1.1px; line-height: 16px;
      padding-top: 32px;
    }

    /* ── Bottom Nav ── */
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 480px; height: 64px;
      background: #fff;
      filter: drop-shadow(0 -2px 5px rgba(26,26,26,.05));
      display: flex; align-items: center; justify-content: space-around;
      padding: 0 59.66px; z-index: 30;
    }
    .nav-item {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 2px; cursor: pointer;
    }
    .nav-item img { object-fit: contain; }
    .nav-label {
      font-size: 10px; font-weight: 500;
      color: #6b6b6b; line-height: 15px;
    }
    .nav-item.active .nav-label { color: #000; }
    .nav-item.active {
      background: #e7e2da;
      border-radius: 12px;
      padding: 4px 12px;
    }
  </style>
</head>
<body>
<div class="page">

  <!-- Header -->
  <header class="header">
    <h1 class="header-title">留白记账</h1>
  </header>

  <!-- Main -->
  <main class="main">

    <!-- Profile header -->
    <div class="profile-header">

      <!-- Avatar -->
      <div class="avatar-wrap">
        <div class="avatar">
          <img src="assets/profile-avatar.png" alt="水墨行者" />
        </div>
        <div class="avatar-seal">
          <img src="assets/profile-seal.png" alt="" />
        </div>
      </div>

      <!-- Name & tagline -->
      <div class="profile-info">
        <div class="profile-name">水墨行者</div>
        <div class="profile-tagline">"见微知著，静心记账"</div>
      </div>

      <!-- Monthly stats -->
      <div class="stats-row">
        <div class="stat-card">
          <span class="stat-label">本月收入</span>
          <span class="stat-amount income">5,200</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">本月支出</span>
          <span class="stat-amount expense">4,820</span>
        </div>
      </div>

    </div>

    <!-- Settings list -->
    <div class="settings-section">
      <div class="settings-heading">个人设置</div>
      <div class="settings-card">

        <div class="settings-item">
          <div class="settings-left">
            <div class="settings-icon">
              <img src="assets/icon-book.png" alt="" style="width:16px;height:20px" />
            </div>
            <span class="settings-name">账本管理</span>
          </div>
          <img class="settings-chevron" src="assets/icon-chevron.png" alt="" />
        </div>

        <div class="settings-divider"></div>

        <div class="settings-item">
          <div class="settings-left">
            <div class="settings-icon">
              <img src="assets/icon-export.png" alt="" style="width:16px;height:16px" />
            </div>
            <span class="settings-name">数据导出</span>
          </div>
          <img class="settings-chevron" src="assets/icon-chevron.png" alt="" />
        </div>

      </div>
    </div>

    <!-- Logout -->
    <div class="logout-section">
      <div class="logout-divider"></div>
      <div class="logout-btn-wrap">
        <button class="logout-btn" type="button" onclick="alert('已退出登录')">
          <span class="logout-text">退出登录</span>
          <img class="logout-underline" src="assets/logout-underline.png" alt="" />
        </button>
      </div>
      <div class="version-text">Version 2.4.0 • Liubai Design</div>
    </div>

  </main>

  <!-- Bottom Nav -->
  <nav class="bottom-nav">
    <div class="nav-item" onclick="location.href='home.html'">
      <img src="assets/nav-home3.png" alt="首页" style="width:18px;height:18px" />
      <span class="nav-label">首页</span>
    </div>
    <div class="nav-item" onclick="location.href='stats-august.html'">
      <img src="assets/nav-stats4.png" alt="统计" style="width:16px;height:16px" />
      <span class="nav-label">统计</span>
    </div>
    <div class="nav-item active">
      <img src="assets/nav-profile3.png" alt="我的" style="width:16px;height:16px" />
      <span class="nav-label">我的</span>
    </div>
  </nav>

</div>
</body>
</html>
