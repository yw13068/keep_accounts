<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>留白记账 · 注册账号</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: 'Noto Serif SC', serif; background: #fdf8f8; }

    .page {
      position: relative;
      min-height: 100vh;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      overflow: hidden;
    }

    /* ── Top nav bar ── */
    .topbar {
      position: relative;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      height: 56px;
      backdrop-filter: blur(6px);
      background: rgba(253,248,248,.8);
    }
    .back-btn {
      width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .back-btn img { width: 11px; height: 19px; object-fit: contain; }
    .topbar-title {
      font-size: 16px; font-weight: 700;
      color: #000; letter-spacing: 3.2px; line-height: 24px;
    }

    /* ── Background illustration ── */
    .bg-illustration {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }
    .bg-illustration img {
      width: 100%; height: 100%;
      object-fit: cover; opacity: .4;
    }

    /* ── Main form area ── */
    .main {
      position: relative;
      z-index: 1;
      padding: 8px 24px 206px;
      max-width: 448px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ── Brand quote ── */
    .brand-quote {
      text-align: center;
      font-size: 16px; font-weight: 400;
      color: #6b6b6b; line-height: 24px;
    }

    /* ── Form fields ── */
    .form-fields {
      display: flex;
      flex-direction: column;
      gap: 89px; /* 16+73px gap per Figma */
      padding-top: 16px;
    }

    .field { display: flex; flex-direction: column; gap: 0; }

    .field-label {
      font-size: 16px; font-weight: 500;
      color: #6b6b6b; letter-spacing: 0;
      line-height: 24px;
      margin-bottom: 12px;
    }

    .input-wrap {
      position: relative;
      border-bottom: 1px solid #d4ccbc;
      padding: 12px 16px 14px 32px;
    }
    .input-wrap:focus-within {
      border-bottom-color: #2b6cb0;
    }

    .field-icon {
      position: absolute;
      left: 5.5px;
      top: 50%; transform: translateY(-50%);
      display: flex; align-items: center; justify-content: center;
    }
    .field-icon img { object-fit: contain; }

    .field-input {
      width: 100%;
      border: none; outline: none;
      background: transparent;
      font-family: 'Noto Serif SC', serif;
      font-size: 16px; font-weight: 400;
      color: #1a1a1a; line-height: normal;
    }
    .field-input::placeholder { color: #c4c7c7; }

    /* Password toggle */
    .pwd-toggle {
      position: absolute;
      right: 0; top: 50%; transform: translateY(-50%);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; padding: 8px;
    }
    .pwd-toggle img { object-fit: contain; }

    /* ── Agreement ── */
    .agreement {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 8px 0 0;
    }
    .agreement-checkbox {
      width: 16px; height: 16px;
      border: 1px solid #d4ccbc;
      border-radius: 2px;
      background: #fff;
      appearance: none; -webkit-appearance: none;
      cursor: pointer;
      flex-shrink: 0;
      margin-top: 4px;
      position: relative;
    }
    .agreement-checkbox:checked::after {
      content: '✓';
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; color: #000;
    }
    .agreement-text {
      font-size: 16px; font-weight: 400;
      color: #6b6b6b; line-height: 26px;
    }
    .agreement-text a {
      color: #000; text-decoration: none;
      border-bottom: 1px solid #d4ccbc;
    }

    /* ── Primary CTA button ── */
    .btn-primary {
      position: relative;
      width: 100%;
      background: #000;
      border: none;
      border-radius: 4px;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      margin-top: 0;
    }
    .btn-primary:hover { background: #2c2c2c; }
    .btn-primary-text {
      font-size: 16px; font-weight: 400;
      color: #fff; line-height: 24px;
    }
    .btn-primary-arrow { width: 17px; height: 17px; object-fit: contain; }

    /* ── Footer ── */
    .footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 8px 0 24px;
    }
    .footer-login {
      display: flex; align-items: center; gap: 8px;
      font-size: 16px; font-weight: 400; color: #6b6b6b; line-height: 24px;
    }
    .footer-login a { color: #000; font-weight: 700; text-decoration: none; }
    .footer-divider {
      width: 96px; height: 1px;
      background: linear-gradient(90deg, rgba(212,204,188,0), #d4ccbc, rgba(212,204,188,0));
      opacity: .3;
    }
    .footer-brand {
      font-family: 'Hanken Grotesk', sans-serif;
      font-size: 10px; font-weight: 400;
      color: #747878; letter-spacing: 2px; text-transform: uppercase;
      line-height: 15px;
    }

    /* ── Corner decoration ── */
    .corner-deco {
      position: absolute;
      bottom: 0; right: 0;
      width: 128px; height: 128px;
      opacity: .1;
      transform: rotate(180deg);
      pointer-events: none;
      overflow: hidden;
    }
    .corner-deco img { width: 183.5%; height: 100%; object-fit: cover; }
  </style>
</head>
<body>
<div class="page">

  <!-- Top Nav Bar -->
  <nav class="topbar">
    <div class="back-btn" onclick="history.back()">
      <img src="assets/btn-back.png" alt="返回" />
    </div>
    <span class="topbar-title">注册账号</span>
    <div style="width:40px"></div>
  </nav>

  <!-- Background illustration -->
  <div class="bg-illustration">
    <img src="assets/reg-bg.png" alt="" />
  </div>

  <!-- Main form -->
  <main class="main">

    <p class="brand-quote">"始于落笔，成于静心。"</p>

    <div class="form-fields">

      <!-- 手机号 -->
      <div class="field">
        <label class="field-label">手机号</label>
        <div class="input-wrap">
          <span class="field-icon"><img src="assets/icon-phone.png" alt="" style="width:14px;height:21px" /></span>
          <input class="field-input" type="tel" placeholder="请输入手机号" />
        </div>
      </div>

      <!-- 用户名 -->
      <div class="field">
        <label class="field-label">用户名 / 笔名</label>
        <div class="input-wrap">
          <span class="field-icon"><img src="assets/icon-user.png" alt="" style="width:15px;height:15px" /></span>
          <input class="field-input" type="text" placeholder="请输入您的称呼" />
        </div>
      </div>

      <!-- 密码 -->
      <div class="field">
        <label class="field-label">密码</label>
        <div class="input-wrap">
          <span class="field-icon"><img src="assets/icon-lock.png" alt="" style="width:15px;height:19.5px" /></span>
          <input class="field-input" id="pwdInput" type="password" placeholder="请输入密码" />
          <span class="pwd-toggle" onclick="togglePwd()">
            <img src="assets/icon-eye.png" alt="显示密码" style="width:21px;height:14px" />
          </span>
        </div>
      </div>

      <!-- 确认密码 -->
      <div class="field">
        <label class="field-label">确认密码</label>
        <div class="input-wrap">
          <span class="field-icon"><img src="assets/icon-lock2.png" alt="" style="width:15px;height:19px" /></span>
          <input class="field-input" id="confirmPwdInput" type="password" placeholder="请再次输入密码" />
        </div>
      </div>

    </div>

    <!-- Agreement -->
    <div class="agreement">
      <input class="agreement-checkbox" type="checkbox" id="agree" />
      <label class="agreement-text" for="agree">
        我已阅读并同意<a href="#">《服务协议》</a>与<a href="#">《隐私政策》</a>，承诺如实记录每一笔收支。
      </label>
    </div>

  </main>

  <!-- Primary CTA -->
  <div style="padding: 0 24px; position: relative; z-index: 1;">
    <button class="btn-primary" type="button">
      <span class="btn-primary-text">开启记账之旅</span>
      <img class="btn-primary-arrow" src="assets/reg-arrow.png" alt="" />
    </button>
  </div>

  <!-- Footer -->
  <footer class="footer" style="padding: 0 24px;">
    <div class="footer-login">
      <span>已有账号？</span>
      <a href="login.html">立即登录</a>
    </div>
    <div class="footer-divider"></div>
    <span class="footer-brand">LIUBAI FINANCE · 留白记账</span>
  </footer>

  <!-- Corner decoration -->
  <div class="corner-deco">
    <img src="assets/reg-corner.png" alt="" />
  </div>

</div>

<script>
  function togglePwd() {
    const pwd = document.getElementById('pwdInput');
    pwd.type = pwd.type === 'password' ? 'text' : 'password';
  }
</script>
</body>
</html>
