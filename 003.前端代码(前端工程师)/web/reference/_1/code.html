<!-- Scripts for simple interactivity -->
<script>
        // Simple numeric input simulation
        const display = document.getElementById('amount-display');
        const buttons = document.querySelectorAll('.keypad-button');
        let currentAmount = "24.50";

        buttons.forEach(btn => {
            btn.addEventListener('click', () => {
                const val = btn.innerText.trim();
                const icon = btn.querySelector('.material-symbols-outlined');
                
                if (icon && icon.innerText === 'backspace') {
                    currentAmount = currentAmount.slice(0, -1) || "0";
                } else if (val && val.length < 2) { // Just the numbers and dot
                    if (currentAmount === "0") currentAmount = val;
                    else currentAmount += val;
                }
                
                display.innerText = currentAmount;
                
                // Visual feedback
                btn.style.backgroundColor = '#e7e2da';
                setTimeout(() => {
                    btn.style.backgroundColor = '#ffffff';
                }, 100);
            });
        });

        // Category selection visual
        const categoryItems = document.querySelectorAll('.grid-cols-4 > div');
        categoryItems.forEach(item => {
            item.addEventListener('click', () => {
                categoryItems.forEach(i => i.querySelector('div').classList.remove('active-category', 'bg-secondary-container'));
                item.querySelector('div').classList.add('active-category');
            });
        });
    </script>
