<style>
        body {
            background-color: #F5F0E8; /* Xuan Paper Color */
            color: #1c1b1b;
            font-family: 'Noto Serif', serif;
        }

        .brush-divider {
            height: 4px;
            background: linear-gradient(90deg, transparent, #000 20%, #000 80%, transparent);
            mask-image: url("data:image/svg+xml,%3Csvg width='100' height='4' viewBox='0 0 100 4' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 2C10 0.5 20 3.5 30 2C40 0.5 60 3.5 70 2C80 0.5 90 3.5 100 2' stroke='black' stroke-width='2'/%3E%3C/svg%3E");
            opacity: 0.15;
        }

        .ink-bleed-progress {
            position: relative;
            height: 6px;
            background: #E5E2E1;
            border-radius: 99px;
            overflow: hidden;
        }

        .ink-bleed-fill {
            height: 100%;
            background: #000;
            border-radius: 99px;
            position: relative;
            transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .ink-bleed-fill::after {
            content: '';
            position: absolute;
            right: -10px;
            top: 0;
            width: 20px;
            height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0.4) 0%, transparent 70%);
            filter: blur(2px);
        }

        .donut-container {
            position: relative;
            width: 220px;
            height: 220px;
            margin: 0 auto;
        }

        .donut-segment {
            fill: none;
            stroke-width: 24;
            transition: stroke-dashoffset 1s ease-out;
            stroke-linecap: round;
        }

        .ink-texture-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0.08;
            background-image: url("https://www.transparenttextures.com/patterns/dark-matter.png");
        }

        .month-chip {
            transition: all 0.2s ease;
            border-bottom: 2px solid transparent;
        }

        .month-chip.active {
            border-bottom-color: #000;
            font-weight: 700;
        }

        .glass-card {
            background-color: #FAF7F2;
            box-shadow: 0 4px 20px rgba(26, 26, 26, 0.04);
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {

<script>
        // Simple interactivity for month selection
        document.querySelectorAll('.month-chip').forEach(chip => {
            chip.addEventListener('click', () => {
                document.querySelector('.month-chip.active').classList.remove('active', 'text-primary');
                document.querySelectorAll('.month-chip:not(.active)').forEach(c => c.classList.add('text-pale-ink')); // Reset others
                
                chip.classList.add('active', 'text-primary');
                chip.classList.remove('text-pale-ink');
            });
        });

        // Micro-interaction: Hovering the donut chart items
        const segments = document.querySelectorAll('.donut-segment');
        segments.forEach(seg => {
            seg.addEventListener('mouseenter', () => {
                seg.style.strokeWidth = "16";
            });
            seg.addEventListener('mouseleave', () => {
                seg.style.strokeWidth = "12";
            });
        });
    </script>
