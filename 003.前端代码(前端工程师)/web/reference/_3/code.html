<style>

<body class="min-h-screen flex flex-col items-center">
<!-- Top AppBar -->
<header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-md">
<div class="flex items-center justify-between px-gutter h-16 w-full max-w-7xl mx-auto">
<button class="flex items-center justify-center w-10 h-10 hover:opacity-80 transition-opacity active:scale-95 transition-transform" onclick="history.back()">
<span class="material-symbols-outlined text-primary">arrow_back_ios_new</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-widest">找回密码</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</div>
</header>
<!-- Main Content Canvas -->
<main class="mt-24 w-full max-w-md px-container-margin flex-grow flex flex-col items-center">
<!-- Identity Graphic/Atmosphere -->
<div class="mb-12 relative w-24 h-24 flex items-center justify-center">
<div class="absolute inset-0 bg-secondary-container opacity-20 rounded-full scale-150 blur-xl"></div>
<span class="material-symbols-outlined text-6xl text-primary font-light">lock_reset</span>
</div>
<!-- Instruction Text -->
<section class="w-full text-center mb-section-gap">
<p class="font-body-lg text-body-lg text-pale-ink leading-relaxed">请输入您的注册手机号，<br>我们将为您发送验证码</p>
</section>
<!-- Form Section -->
<div class="w-full space-y-8">
<!-- Account Input -->
<div class="relative group">
<input class="w-full bg-transparent border-t-0 border-x-0 border-b border-ink-wash-gray py-4 font-body-lg text-body-lg ink-focus transition-all duration-300 placeholder:text-outline-variant" placeholder="手机号" type="text">
<span class="absolute right-0 top-4 material-symbols-outlined text-outline-variant group-focus-within:text-slate-blue transition-colors">smartphone</span>
</div>
<!-- Verification Code Row -->
<div class="flex items-end gap-4">
<div class="flex-grow relative group">
<input class="w-full bg-transparent border-t-0 border-x-0 border-b border-ink-wash-gray py-4 font-number-standard text-number-standard ink-focus transition-all duration-300 placeholder:text-outline-variant tracking-[0.5em]" placeholder="验证码" type="text">
</div>
<button class="pb-3 text-slate-blue font-label-caps text-label-caps whitespace-nowrap hover:opacity-70 transition-opacity active:scale-95" id="send-code">
                    发送验证码
                </button>
</div>
<!-- Brush Divider -->
<!-- New Password Input -->
<div class="relative group">
<input class="w-full bg-transparent border-t-0 border-x-0 border-b border-ink-wash-gray py-4 font-body-lg text-body-lg ink-focus transition-all duration-300 placeholder:text-outline-variant" id="new-password" placeholder="新密码" type="password">
<button class="absolute right-0 top-4 flex items-center justify-center hover:opacity-70 transition-opacity" onclick="const input = document.getElementById('new-password'); const icon = this.querySelector('.material-symbols-outlined'); if(input.type === 'password') { input.type = 'text'; icon.innerText = 'visibility'; } else { input.type = 'password'; icon.innerText = 'visibility_off'; }">
<span class="material-symbols-outlined text-outline-variant group-focus-within:text-slate-blue transition-colors">visibility_off</span>
</button>
</div>
<!-- Main Reset Button -->
<button class="w-full bg-primary text-on-primary py-5 rounded-lg font-headline-md text-headline-md tracking-[0.2em] ink-shadow hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2">确认重置</button>
</div>
<!-- Artistic Quote Footer (Liubai style) -->
<footer class="mb-12 text-center mt-24">
<p class="font-body-sm text-body-sm text-outline-variant italic">
                “见微知著，静心记账”
            </p>
</footer>
</main>
<!-- Decorative Ink Elements -->
<div class="fixed -bottom-10 -left-10 w-64 h-64 opacity-5 pointer-events-none">
<div class="w-full h-full bg-contain bg-no-repeat rotate-45" data-alt="A soft, ethereal digital painting of a single traditional Chinese ink wash brush stroke in deep black, fading into a textured beige background reminiscent of ancient Xuan paper. The lighting is soft and ambient, creating a calm and intellectual atmosphere consistent with a minimalist finance app's aesthetic." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCs5p49B8Q4TovBIWBV6v36NzG41Kii6G426nnXBw8-d5tLGm-9_EelR1ef1XjM1CfrBRqN7azy6HviygwQeKHu9byhpETdG1kCKl89A3h6tC7syCFDULR9ThhjoyfMCqiLt8SIuEDhXDtDib3E5JrL0oSMadnOBQXPzS_Y3aWusxXqu9dysG9LTzX0taO9sn4YAFrUwAlN_4Eid5pdqzOvoWH5rvlTCMukJjHyIqwe4isrG7zEYacHhg')"></div>
</div>
<script>
        // Simple Interaction logic
        const sendBtn = document.getElementById('send-code');
        let timer = null;
        let countdown = 60;

        sendBtn.addEventListener('click', () => {
            if (timer) return;
            
            sendBtn.classList.add('text-outline');
            sendBtn.classList.remove('text-slate-blue');
            sendBtn.disabled = true;
            
            timer = setInterval(() => {
                countdown--;
                sendBtn.innerText = `重新获取 (${countdown}s)`;
                
                if (countdown <= 0) {
                    clearInterval(timer);
                    timer = null;
                    countdown = 60;
                    sendBtn.innerText = "发送验证码";
                    sendBtn.classList.add('text-slate-blue');
                    sendBtn.classList.remove('text-outline');
                    sendBtn.disabled = false;
                }
            }, 1000);
        });

        // Micro-interaction for inputs
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('.material-symbols-outlined')?.classList.add('scale-110');
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('.material-symbols-outlined')?.classList.remove('scale-110');
            });
        });
    </script>
