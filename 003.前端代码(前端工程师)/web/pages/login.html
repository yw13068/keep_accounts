<!DOCTYPE html>
<html class="light" lang="zh-CN">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport">
<title>留白记账 - 登录</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
tailwind.config = {
  darkMode: "class",
  theme: {
    extend: {
      colors: {
        "background": "#F5F0E8",
        "surface": "#F5F0E8",
        "surface-bright": "#F5F0E8",
        "surface-container-lowest": "#ffffff",
        "surface-container-low": "#f7f3f2",
        "surface-container": "#f1edec",
        "surface-container-high": "#ebe7e6",
        "surface-container-highest": "#e5e2e1",
        "on-background": "#1c1b1b",
        "on-surface": "#1c1b1b",
        "on-surface-variant": "#444748",
        "inverse-surface": "#313030",
        "inverse-on-surface": "#f4f0ef",
        "outline": "#747878",
        "outline-variant": "#c4c7c7",
        "surface-tint": "#5f5e5e",
        "primary": "#000000",
        "on-primary": "#ffffff",
        "primary-container": "#1c1b1b",
        "on-primary-container": "#858383",
        "inverse-primary": "#c8c6c5",
        "secondary": "#615e58",
        "on-secondary": "#ffffff",
        "secondary-container": "#e7e2da",
        "on-secondary-container": "#67645e",
        "secondary-fixed": "#e7e2da",
        "secondary-fixed-dim": "#cac6be",
        "on-secondary-fixed": "#1d1c17",
        "on-secondary-fixed-variant": "#494741",
        "tertiary": "#000000",
        "on-tertiary": "#ffffff",
        "tertiary-container": "#1c1b1a",
        "on-tertiary-container": "#868382",
        "tertiary-fixed": "#e6e2df",
        "tertiary-fixed-dim": "#cac6c4",
        "on-tertiary-fixed": "#1c1b1a",
        "on-tertiary-fixed-variant": "#484645",
        "error": "#ba1a1a",
        "on-error": "#ffffff",
        "error-container": "#ffdad6",
        "on-error-container": "#93000a",
        "primary-fixed": "#e5e2e1",
        "primary-fixed-dim": "#c8c6c5",
        "on-primary-fixed": "#1c1b1b",
        "on-primary-fixed-variant": "#474746",
        "ink-wash-gray": "#D4CCBC",
        "pine-green": "#2E7D5E",
        "cinnabar-red": "#C0392B",
        "slate-blue": "#2B6CB0",
        "ochre-warning": "#B7610A",
        "pale-ink": "#6B6B6B",
      },
      borderRadius: {
        "DEFAULT": "0.125rem",
        "lg": "0.25rem",
        "xl": "0.5rem",
        "full": "0.75rem"
      },
      spacing: {
        "unit": "8px",
        "container-margin": "24px",
        "section-gap": "40px",
        "gutter": "16px",
        "ink-stroke-thick": "3px",
        "ink-stroke-thin": "1px"
      },
      fontFamily: {
        "headline-lg": ["Noto Serif SC", "serif"],
        "headline-lg-mobile": ["Noto Serif SC", "serif"],

        "body-lg": ["Noto Serif SC", "serif"],

        "number-display": ["Hanken Grotesk", "sans-serif"],

      },
      fontSize: {
        "headline-lg": ["28px", {lineHeight: "36px", letterSpacing: "-0.02em", fontWeight: "700"}],
        "headline-lg-mobile": ["24px", {lineHeight: "32px", fontWeight: "700"}],
        "headline-md": ["20px", {lineHeight: "28px", fontWeight: "600"}],
        "body-lg": ["16px", {lineHeight: "24px", fontWeight: "400"}],
        "body-sm": ["13px", {lineHeight: "20px", fontWeight: "400"}],
        "number-display": ["32px", {lineHeight: "40px", letterSpacing: "0.05em", fontWeight: "600"}],
        "number-standard": ["18px", {lineHeight: "24px", fontWeight: "500"}],
        "label-caps": ["11px", {lineHeight: "16px", letterSpacing: "0.1em", fontWeight: "700"}],
      }
    },
  },
}
</script>
<style>
.material-symbols-outlined {
  font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
}
.brush-divider {
  height: 2px;
  background: linear-gradient(90deg, transparent 0%, #D4CCBC 50%, transparent 100%);
  mask-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 100 2" xmlns="http://www.w3.org/2000/svg"><path d="M0 1 C 20 0, 80 2, 100 1" stroke="black" stroke-width="2" fill="none"/></svg>');
  width: 100%;
}
.xuan-paper {
  background-color: #F5F0E8;
  background-image: url("https://www.transparenttextures.com/patterns/natural-paper.png");
}
.ink-checkbox {
  appearance: none;
  width: 18px;
  height: 18px;
  border: 1px solid #747878;
  border-radius: 2px;
  background-color: transparent;
  display: grid;
  place-content: center;
  cursor: pointer;
}
.ink-checkbox:checked {
  background-color: #000;
  border-color: #000;
}
.ink-checkbox:checked::before {
  content: "";
  width: 10px;
  height: 10px;
  transform: scale(1);
  background-color: white;
  clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
}
</style>
</head>
<body class="xuan-paper text-on-background min-h-screen flex flex-col font-body-lg selection:bg-ink-wash-gray selection:text-primary">
<main class="flex-grow flex flex-col items-center justify-center px-container-margin py-section-gap">
<div class="w-full max-w-sm flex flex-col items-center animate-fade-in">
<!-- Logo & Branding -->
<div class="mb-section-gap text-center">
<div class="mb-4 inline-block">
<svg class="w-32 h-32 mx-auto" viewBox="0 0 128 128" fill="none">
  <circle cx="64" cy="64" r="60" fill="#FAF7F2" stroke="#D4CCBC" stroke-width="2"/>
  <circle cx="64" cy="64" r="52" fill="none" stroke="#D4CCBC" stroke-width="0.5" stroke-dasharray="4 4"/>
  <text x="64" y="76" text-anchor="middle" font-family="Noto Serif SC, serif" font-size="48" font-weight="700" fill="#1c1b1b">留</text>
</svg>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tight">留白记账</h1>
<p class="font-body-sm text-pale-ink mt-2 italic">记账，是一种生活的修行。</p>
</div>
<!-- Login Form -->
<form class="w-full space-y-gutter" onsubmit="handleLogin(event)">
<!-- Username -->
<div class="relative group">
<label class="font-label-caps text-label-caps text-pale-ink block mb-1" for="username">手机号</label>
<input class="w-full bg-transparent border-t-0 border-x-0 border-b border-ink-wash-gray focus:border-b-2 focus:border-slate-blue focus:ring-0 py-2 px-0 font-body-lg text-body-lg placeholder:text-outline-variant" id="username" placeholder="请输入手机号" required="" type="text">
</div>
<!-- Password -->
<div class="relative group">
<div class="flex justify-between items-end mb-1">
<label class="font-label-caps text-label-caps text-pale-ink block" for="password">密码</label>
<a href="forgot.html" class="font-label-caps text-slate-blue hover:opacity-80 text-xs">忘记密码？</a>
</div>
<input class="w-full bg-transparent border-t-0 border-x-0 border-b border-ink-wash-gray focus:border-b-2 focus:border-slate-blue focus:ring-0 py-2 px-0 font-body-lg text-body-lg placeholder:text-outline-variant" id="password" placeholder="请输入密码" required="" type="password">
</div>
<!-- Remember Me -->
<div class="flex items-center justify-between py-2">
<label class="flex items-center gap-2 cursor-pointer group">
<input class="ink-checkbox" type="checkbox" checked>
<span class="font-body-sm text-on-surface-variant group-hover:text-primary transition-colors">记住登录状态</span>
</label>
</div>
<!-- Login Button -->
<div class="pt-4">
<button class="w-full bg-primary text-on-primary py-4 font-label-caps text-label-caps tracking-[0.2em] uppercase active:scale-[0.98] hover:opacity-90 border border-primary transition-all" type="submit" id="loginBtn">登 录</button>
</div>
</form>
<!-- Secondary Actions -->
<div class="mt-section-gap w-full">
<div class="brush-divider mb-8"></div>
<div class="text-center">
<p class="font-body-sm text-on-surface-variant mb-4">初识留白？</p>
<a class="inline-block px-8 py-3 border border-primary text-primary font-label-caps text-label-caps tracking-[0.15em] uppercase hover:bg-surface-container-low transition-colors" href="register.html">注 册 账 号</a>
</div>
</div>
</div>
</main>
<!-- Background Atmospheric -->
<div class="fixed bottom-0 left-0 w-full opacity-10 pointer-events-none select-none overflow-hidden h-64">
<svg class="w-full h-full fill-ink-wash-gray" preserveAspectRatio="none" viewBox="0 0 1000 100">
<path d="M0,50 Q250,10 500,50 T1000,50 L1000,100 L0,100 Z" opacity="0.3"></path>
<path d="M0,70 Q300,30 600,70 T1000,70 L1000,100 L0,100 Z" opacity="0.5"></path>
</svg>
</div>
<script>
function handleLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const orig = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = "正在验证...";
  setTimeout(() => {
    btn.innerHTML = "登录成功";
    btn.classList.remove('bg-primary');
    btn.classList.add('bg-pine-green', 'border-pine-green');
    setTimeout(() => window.location.href = 'home.html', 800);
  }, 1200);
}
</script>
</body>
</html>
