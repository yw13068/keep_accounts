<script src="../assets/js/api.js"></script>
<script>
let currentDate = new Date();
let currentMonth = `${currentDate.getFullYear()}-${String(currentDate.getMonth() + 1).padStart(2, '0')}`;

// 更新月份显示
function updateMonthLabel() {
  const [year, month] = currentMonth.split('-');
  document.getElementById('currentMonthLabel').textContent = `${year}年${parseInt(month)}月`;
}

// 切换月份
function changeMonth(delta) {
  const [year, month] = currentMonth.split('-').map(Number);
  const newDate = new Date(year, month - 1 + delta, 1);
  currentMonth = `${newDate.getFullYear()}-${String(newDate.getMonth() + 1).padStart(2, '0')}`;
  updateMonthLabel();
  loadBudgetData();
}

// 渲染总览数据
function renderOverview(data) {
  const percent = data.percent || 0;
  const spent = data.totalSpent || 0;
  const total = data.totalBudget || 0;
  const remain = total - spent;

  document.getElementById('budgetPercent').textContent = total > 0 ? percent : '--';
  document.getElementById('budgetSpent').textContent = `¥ ${spent.toLocaleString('zh-CN')}`;
  document.getElementById('budgetTotal').textContent = total > 0 ? `¥ ${total.toLocaleString('zh-CN')}` : '未设置';
  document.getElementById('budgetProgressBar').style.width = total > 0 ? `${Math.min(percent, 100)}%` : '0%';
  document.getElementById('budgetRemain').textContent = total > 0 ? `剩余 ¥ ${remain.toLocaleString('zh-CN')}` : '剩余 ¥ --';

  // 预警提示
  const warning = document.getElementById('budgetWarning');
  if (percent >= 80 && total > 0) {
    warning.classList.remove('hidden');
  } else {
    warning.classList.add('hidden');
  }
}

// 获取进度条颜色
function getProgressColor(percent) {
  if (percent >= 100) return 'bg-cinnabar-red';
  if (percent >= 80) return 'bg-ochre-warning';
  return 'bg-pine-green';
}

// 渲染分类列表
function renderCategoryList(categories) {
  const container = document.getElementById('categoryBudgetList');

  // 只展示已配置预算的分类（budget > 0）
  const configuredCategories = categories.filter(cat => cat.budget > 0);

  if (!configuredCategories || configuredCategories.length === 0) {
    container.innerHTML = '<p class="text-center font-body-sm text-pale-ink py-4">暂未配置预算<br><span class="text-xs opacity-60">点击底部导航"我的"→"预算管理"去设置</span></p>';
    return;
  }

  let html = '';
  configuredCategories.forEach((cat, index) => {
    const percent = cat.budget > 0 ? Math.round((cat.spent / cat.budget) * 100) : 0;
    const displayPercent = Math.min(percent, 100);
    const colorClass = getProgressColor(percent);
    const budgetText = `¥ ${cat.spent.toLocaleString('zh-CN')} / ¥ ${cat.budget.toLocaleString('zh-CN')}`;

    html += `
      <div class="flex flex-col gap-2">
        <div class="flex justify-between items-center">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 bg-surface-container-low rounded-lg flex items-center justify-center">
              <span class="material-symbols-outlined text-primary">${cat.icon}</span>
            </div>
            <span class="font-body-lg text-primary font-medium">${cat.name}</span>
          </div>
          <span class="font-body-lg text-primary">${budgetText}</span>
        </div>
        <div class="h-1.5 bg-surface-container-high rounded-full overflow-hidden">
          <div class="h-full ${colorClass} rounded-full" style="width:${displayPercent}%"></div>
        </div>
      </div>
    `;

    if (index < configuredCategories.length - 1) {
      html += '<div class="h-px bg-gradient-to-r from-transparent via-ink-wash-gray to-transparent opacity-30"></div>';
    }
  });

  container.innerHTML = html;
}

// 加载预算数据
async function loadBudgetData() {
  try {
    const res = await API.budget.getMonthBudget(currentMonth);
    if (res.code === 0) {
      renderOverview(res.data);
      renderCategoryList(res.data.categories);

      // 检查是否有分类达到80%预警
      const warningCats = (res.data.categories || []).filter(cat => {
        return cat.budget > 0 && (cat.spent / cat.budget) >= 0.8 && (cat.spent / cat.budget) < 1;
      });
      if (warningCats.length > 0) {
        const names = warningCats.map(c => c.name).join('、');
        setTimeout(() => {
          alert(`⚠️ 预算预警：${names} 已超过80%！`);
        }, 500);
      }
    } else {
      console.error('加载预算数据失败:', res.message);
    }
  } catch (e) {
    console.error('加载预算数据失败:', e);
  }
}

// 页面初始化
document.addEventListener('DOMContentLoaded', async function() {
  // 检查登录状态
  if (!TokenStorage.get()) {
    window.location.href = 'login.html';
    return;
  }

  updateMonthLabel();
  await loadBudgetData();
});
</script>
