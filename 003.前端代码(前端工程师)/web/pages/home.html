<body class="min-h-dvh" style="background-color:#F5F0E8;font-family:'Noto Serif SC',serif">
<!-- Top App Bar -->
<header class="sticky top-0 z-30 bg-surface/90 backdrop-blur-md flex items-center justify-center h-16 border-b" style="border-color:rgba(212,204,188,0.3)">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-widest">留白记账</h1>

<main class="max-w-md mx-auto px-container-margin py-6 pb-32 flex flex-col gap-8">
<!-- 月份导航 -->
<div class="flex items-center justify-center py-2">
<button onclick="toggleMonthPicker()" class="flex items-center gap-2 px-4 py-2 rounded-lg hover:bg-surface-container-low transition-colors">
<span id="monthLabel" class="font-body-lg text-body-lg text-primary">2024年8月</span>
<svg class="w-2 h-2" viewBox="0 0 8 5" fill="none"><path d="M1 1l3 3 3-3" stroke="#1c1b1b" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
</button>
</div>

<!-- 月份选择器浮层 -->
<div id="monthPicker" class="fixed inset-0 z-50 bg-black/30 backdrop-blur-sm hidden" onclick="closePicker(event)">
<div class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-surface-container-lowest rounded-xl p-6 shadow-xl min-w-[280px]" onclick="event.stopPropagation()">
<p class="font-headline-md text-headline-md text-center mb-4 text-primary">选择月份</p>
<div class="grid grid-cols-3 gap-2">
<button onclick="selectMonth('2024年10月')" class="py-3 px-2 rounded-lg border border-surface-container-high bg-surface-container-lowest text-body-lg text-pale-ink hover:bg-surface-container-low transition-colors">2024年10月</button>
<button onclick="selectMonth('2024年9月')" class="py-3 px-2 rounded-lg border border-surface-container-high bg-surface-container-lowest text-body-lg text-pale-ink hover:bg-surface-container-low transition-colors">2024年9月</button>
<button onclick="selectMonth('2024年8月')" class="py-3 px-2 rounded-lg border-2 border-primary bg-primary text-white font-bold">2024年8月</button>
<button onclick="selectMonth('2024年7月')" class="py-3 px-2 rounded-lg border border-surface-container-high bg-surface-container-lowest text-body-lg text-pale-ink hover:bg-surface-container-low transition-colors">2024年7月</button>
<button onclick="selectMonth('2024年6月')" class="py-3 px-2 rounded-lg border border-surface-container-high bg-surface-container-lowest text-body-lg text-pale-ink hover:bg-surface-container-low transition-colors">2024年6月</button>
<button onclick="selectMonth('2024年5月')" class="py-3 px-2 rounded-lg border border-surface-container-high bg-surface-container-lowest text-body-lg text-pale-ink hover:bg-surface-container-low transition-colors">2024年5月</button>
</div>
<button onclick="closePickerAll()" class="mt-4 w-full py-3 bg-surface-container-low rounded-lg text-body-lg text-pale-ink hover:bg-surface-container-low transition-colors">取消</button>
</div>
</div>

<!-- 本月结余卡片 -->
<div class="bg-surface-container-lowest rounded-xl p-6 flex flex-col gap-3 shadow-sm">
<p class="font-label-caps text-label-caps text-pale-ink text-center uppercase">本月结余</p>
<p class="font-number-display text-number-display text-primary text-center tracking-wide">¥ 12,480.00</p>
<div class="flex gap-8 justify-center pt-2">
<div class="flex-1 text-center">
<p class="font-label-caps text-label-caps text-pine-green uppercase mb-1">收入</p>
<p class="font-number-standard text-number-standard text-pine-green">24,000.00</p>
</div>
<div class="flex-1 text-center">
<p class="font-label-caps text-label-caps text-cinnabar-red uppercase mb-1">支出</p>
<p class="font-number-standard text-number-standard text-cinnabar-red">11,520.00</p>
</div>
</div>
</div>

<!-- 支出/收入切换 -->
<div class="flex justify-center">
<div class="relative flex items-center bg-surface-container-low p-1 rounded-full border border-outline-variant/30 w-48">
<div id="typeIndicator" class="absolute left-1 top-1 bottom-1 w-[calc(50%-4px)] bg-primary rounded-full transition-transform duration-300"></div>
<button class="relative z-10 flex-1 py-2 text-center transition-colors duration-300" id="btnExpense" onclick="switchType('expense')">
<span class="font-body-lg text-white font-medium">支出</span>
</button>
<button class="relative z-10 flex-1 py-2 text-center transition-colors duration-300" id="btnIncome" onclick="switchType('income')">
<span class="font-body-lg text-pale-ink">收入</span>
</button>
</div>

<!-- 账单列表 -->
<div class="flex flex-col gap-4">

<div class="brush-divider opacity-50"></div>

</div>
</div>
<span class="font-number-standard text-number-standard text-cinnabar-red">-38.00</span>
</div>

<div class="bg-surface-container-lowest rounded-xl p-4 flex items-center justify-between shadow-sm">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-ink-wash-gray/20 flex items-center justify-center">

</div>
<div>
<p class="font-body-lg text-body-lg text-primary">城市地铁</p>
<p class="font-body-sm text-pale-ink mt-0.5">地铁往返</p>
</div>
</div>
<span class="font-number-standard text-number-standard text-cinnabar-red">-12.00</span>

<div class="bg-surface-container-lowest rounded-xl p-4 flex items-center justify-between shadow-sm">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-ink-wash-gray/20 flex items-center justify-center">

</div>
<div>
<p class="font-body-lg text-body-lg text-primary">工资入账</p>
<p class="font-body-sm text-pale-ink mt-0.5">月度工资</p>
</div>
</div>
<span class="font-number-standard text-number-standard text-pine-green">+8,000.00</span>
</div>

</nav>

<script>
function toggleMonthPicker() {
  const p = document.getElementById('monthPicker');
  p.style.display = p.style.display === 'none' ? 'flex' : 'none';
}
function closePicker(e) { if (e.target === e.currentTarget) e.currentTarget.style.display = 'none'; }
function closePickerAll() { document.getElementById('monthPicker').style.display = 'none'; }
function selectMonth(label) {
  document.getElementById('monthLabel').textContent = label;
  closePickerAll();
}
function switchType(type) {
  const ind = document.getElementById('typeIndicator');
  const prefix = ind.previousElementSibling || ind.nextElementSibling;
  if (type === 'income') {
    ind.style.transform = 'translateX(88px)';
    document.getElementById('btnExpense').querySelector('span').className = 'font-body-lg text-pale-ink';
    document.getElementById('btnIncome').querySelector('span').className = 'font-body-lg text-white font-medium';
  } else {
    ind.style.transform = 'translateX(0)';
    document.getElementById('btnExpense').querySelector('span').className = 'font-body-lg text-white font-medium';
    document.getElementById('btnIncome').querySelector('span').className = 'font-body-lg text-pale-ink';
  }
}
</script>
