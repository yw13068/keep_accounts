<!DOCTYPE html>

<head>

        "secondary": "#615e58",
        "on-secondary": "#ffffff",

        "on-secondary-container": "#67645e",
        "secondary-fixed": "#e7e2da",

        "on-secondary-fixed": "#1d1c17",
        "on-secondary-fixed-variant": "#494741",
        "tertiary": "#000000",

<style>
.material-symbols-outlined {
  font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
}
.brush-divider {
  height: 2px;
  background: linear-gradient(90deg, transparent 0%, #D4CCBC 50%, transparent 100%);
  width: 100%;
}
.seal-transition {
  transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.seal-transition:active {
  transform: scale(0.92);
}
</style>
</head>
<body class="min-h-screen text-on-surface" style="background-color:#F5F0E8;font-family:'Noto Serif SC',serif">
<!-- Top AppBar -->
<nav class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-md px-4 h-14 flex items-center justify-between" style="background:rgba(245,240,232,0.8)">
<button class="flex items-center justify-center w-10 h-10 hover:opacity-80 transition-opacity active:scale-95" onclick="history.back()">
<span class="material-symbols-outlined text-primary">arrow_back_ios_new</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold tracking-[0.2em] text-primary">注册账号</h1>
<div class="w-10"></div>
</nav>
<!-- Main Content -->
<main class="px-container-margin max-w-md mx-auto flex flex-col min-h-screen pt-20 pb-8">
<!-- Brand Quote -->
<div class="mb-8 text-center">
<p class="font-body-lg text-pale-ink italic">"始于落笔，成于静心。"</p>
</div>
<!-- Registration Form -->
<form class="flex flex-col gap-4" onsubmit="handleRegister(event)">
<!-- Phone -->
<div class="relative group">
<label class="block font-label-caps text-label-caps text-pale-ink uppercase mb-1">手机号</label>
<div class="flex items-center">
<span class="material-symbols-outlined absolute left-0 text-ink-wash-gray group-focus-within:text-primary transition-colors">phone_iphone</span>
<input class="w-full pl-8 pr-4 py-3 bg-transparent border-0 border-b border-ink-wash-gray focus:ring-0 focus:border-primary font-body-lg text-body-lg transition-all placeholder:text-outline-variant" id="phone" placeholder="请输入手机号" required type="text">
</div>
</div>
<!-- Username -->
<div class="relative group">
<label class="block font-label-caps text-label-caps text-pale-ink uppercase mb-1">用户名 / 笔名</label>
<div class="flex items-center">
<span class="material-symbols-outlined absolute left-0 text-ink-wash-gray group-focus-within:text-primary transition-colors">person</span>
<input class="w-full pl-8 pr-4 py-3 bg-transparent border-0 border-b border-ink-wash-gray focus:ring-0 focus:border-primary font-body-lg text-body-lg transition-all placeholder:text-outline-variant" id="username" placeholder="请输入您的称呼" required type="text">
</div>
</div>
<!-- Password -->
<div class="relative group">
<label class="block font-label-caps text-label-caps text-pale-ink uppercase mb-1">密码</label>
<div class="flex items-center">
<span class="material-symbols-outlined absolute left-0 text-ink-wash-gray group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full pl-8 pr-10 py-3 bg-transparent border-0 border-b border-ink-wash-gray focus:ring-0 focus:border-primary font-body-lg text-body-lg transition-all placeholder:text-outline-variant" id="pwd" placeholder="请输入密码" required type="password">
<button class="absolute right-0 text-ink-wash-gray hover:text-primary" type="button" onclick="togglePwd()">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Confirm Password -->
<div class="relative group">
<label class="block font-label-caps text-label-caps text-pale-ink uppercase mb-1">确认密码</label>
<div class="flex items-center">
<span class="material-symbols-outlined absolute left-0 text-ink-wash-gray group-focus-within:text-primary transition-colors">verified_user</span>
<input class="w-full pl-8 pr-4 py-3 bg-transparent border-0 border-b border-ink-wash-gray focus:ring-0 focus:border-primary font-body-lg text-body-lg transition-all placeholder:text-outline-variant" id="confirmPwd" placeholder="请再次输入密码" required type="password">
</div>
</div>
<!-- Agreement -->
<div class="flex items-start gap-3 py-2">
<input class="mt-1 w-4 h-4 text-primary border-ink-wash-gray rounded-sm focus:ring-primary focus:ring-offset-surface" id="terms" type="checkbox" required>
<label class="font-body-sm text-pale-ink leading-relaxed mt-1" for="terms">
我已阅读并同意 <a class="text-primary border-b border-ink-wash-gray" href="#">《服务协议》</a> 与 <a class="text-primary border-b border-ink-wash-gray" href="#">《隐私政策》</a>，承诺如实记录每一笔收支。
</label>
</div>
<!-- Submit Button -->
<div class="pt-4">
<button class="w-full h-14 bg-primary text-on-primary font-headline-md rounded-lg shadow-lg seal-transition flex items-center justify-center gap-2 hover:opacity-90 active:bg-inverse-surface" type="submit" id="regBtn">
<span>开启记账之旅</span>
<span class="material-symbols-outlined">brush</span>
</button>
</div>
</form>
<!-- Login Link -->
<div class="mt-8 text-center">
<p class="font-body-sm text-pale-ink">已有账号？<a class="text-primary font-bold hover:underline decoration-cinnabar-red decoration-2 underline-offset-4" href="login.html">立即登录</a></p>
</div>
<div class="flex justify-center opacity-30 mt-4">
<div class="w-24 h-[1px] bg-gradient-to-r from-transparent via-ink-wash-gray to-transparent"></div>
</div>
<p class="mt-4 font-label-caps text-[10px] text-outline tracking-[0.2em] uppercase text-center">Liubai Finance · 留白记账</p>
</main>
<script>
function togglePwd() {
  const input = document.getElementById('pwd');
  const icon = event.currentTarget.querySelector('.material-symbols-outlined');
  if (input.type === 'password') {
    input.type = 'text';
    icon.textContent = 'visibility_off';
  } else {
    input.type = 'password';
    icon.textContent = 'visibility';
  }
}
function handleRegister(e) {
  e.preventDefault();
  const pwd = document.getElementById('pwd').value;
  const confirm = document.getElementById('confirmPwd').value;
  if (pwd !== confirm) { alert('两次密码不一致'); return; }
  const btn = document.getElementById('regBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span>';
  setTimeout(() => {
    btn.innerHTML = '<span>注册成功</span><span class="material-symbols-outlined">check_circle</span>';
    btn.classList.replace('bg-primary', 'bg-pine-green');
    setTimeout(() => window.location.href = 'home.html', 800);
  }, 1200);
}
</script>
</body>
</html>
