<script src="../assets/js/api.js"></script>
<script>
async function loadMonthSummary() {
  try {
    const now = new Date();
    const month = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
    const res = await API.record.getMonthSummary(month);
    if (res.code === 0) {
      document.getElementById('monthIncome').textContent = `¥ ${res.data.income.toLocaleString('zh-CN', { minimumFractionDigits: 0, maximumFractionDigits: 0 })}`;
      document.getElementById('monthExpense').textContent = `¥ ${res.data.expense.toLocaleString('zh-CN', { minimumFractionDigits: 0, maximumFractionDigits: 0 })}`;
    }
  } catch (e) {
    console.error('加载月度统计失败:', e);
  }
}

function handleLogout() {
  if (confirm('确定要退出登录吗？')) {
    API.auth.logout();
  }
}

// 加载用户信息
async function loadUserProfile() {
  try {
    const res = await API.user.getProfile();
    if (res.code === 0 && res.data) {
      const { username, avatarUrl } = res.data;
      if (username) {
        document.getElementById('usernameDisplay').textContent = username;
      }
      if (avatarUrl) {
        const img = document.getElementById('avatarImg');
        const placeholder = document.getElementById('avatarPlaceholder');
        img.src = avatarUrl.startsWith('http') ? avatarUrl : API_BASE_URL + avatarUrl;
        img.classList.remove('hidden');
        placeholder.classList.add('hidden');
      }
    }
  } catch (e) {
    console.error('加载用户信息失败:', e);
  }
}

// 处理头像选择并上传
async function handleAvatarChange(input) {
  const file = input.files[0];
  if (!file) return;

  // 预览本地图片
  const reader = new FileReader();
  reader.onload = async function(e) {
    const img = document.getElementById('avatarImg');
    const placeholder = document.getElementById('avatarPlaceholder');
    img.src = e.target.result;
    img.classList.remove('hidden');
    placeholder.classList.add('hidden');

    // 压缩图片到 150KB 以内
    const compressedBase64 = await compressImage(e.target.result, 150);

    // 上传到服务器
    try {
      const res = await API.user.uploadAvatar(compressedBase64);
      if (res.code === 0) {
        console.log('头像上传成功:', res.data.avatarUrl);
      } else {
        alert('头像上传失败: ' + (res.message || '未知错误'));
      }
    } catch (e) {
      console.error('头像上传失败:', e);
      alert('头像上传失败，请重试');
    }
  };
  reader.readAsDataURL(file);

  // 清空 input，允许重复选择同一文件
  input.value = '';
}

// 图片压缩：确保不超过 maxKB KB
function compressImage(base64, maxKB) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement('canvas');
      let width = img.width;
      let height = img.height;

      // 先缩放到合理尺寸（最大边 800px）
      const maxDim = 800;
      if (width > maxDim || height > maxDim) {
        if (width > height) {
          height = Math.round(height * maxDim / width);
          width = maxDim;
        } else {
          width = Math.round(width * maxDim / height);
          height = maxDim;
        }
      }

      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);

      // 逐步降低质量直到小于 maxKB
      let quality = 0.9;
      let result = canvas.toDataURL('image/jpeg', quality);

      while (result.length > maxKB * 1024 * 1.5 && quality > 0.1) {
        quality -= 0.1;
        result = canvas.toDataURL('image/jpeg', quality);
      }

      resolve(result);
    };
    img.src = base64;
  });
}

// 页面初始化
document.addEventListener('DOMContentLoaded', async function() {
  // 检查登录状态
  if (!TokenStorage.get()) {
    window.location.href = 'login.html';
    return;
  }
  // 加载用户信息
  await loadUserProfile();
  // 加载月度统计
  await loadMonthSummary();
});
</script>
