<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport">
<title>留白记账 - 记一笔</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
tailwind.config = {
  darkMode: "class",
  theme: {
    extend: {
      colors: {
        "background": "#fdf8f8",
        "surface": "#fdf8f8",
        "surface-bright": "#fdf8f8",
        "surface-container-lowest": "#ffffff",
        "surface-container-low": "#f7f3f2",
        "surface-container": "#f1edec",
        "surface-container-high": "#ebe7e6",
        "surface-container-highest": "#e5e2e1",
        "on-background": "#1c1b1b",
        "on-surface": "#1c1b1b",
        "on-surface-variant": "#444748",
        "inverse-surface": "#313030",
        "inverse-on-surface": "#f4f0ef",
        "outline": "#747878",
        "outline-variant": "#c4c7c7",
        "surface-tint": "#5f5e5e",
        "primary": "#000000",
        "on-primary": "#ffffff",
        "primary-container": "#1c1b1b",
        "on-primary-container": "#858383",
        "inverse-primary": "#c8c6c5",
        "secondary": "#615e58",
        "on-secondary": "#ffffff",
        "secondary-container": "#e7e2da",
        "on-secondary-container": "#67645e",
        "secondary-fixed": "#e7e2da",
        "secondary-fixed-dim": "#cac6be",
        "on-secondary-fixed": "#1d1c17",
        "on-secondary-fixed-variant": "#494741",
        "tertiary": "#000000",
        "on-tertiary": "#ffffff",
        "tertiary-container": "#1c1b1a",
        "on-tertiary-container": "#868382",
        "tertiary-fixed": "#e6e2df",
        "tertiary-fixed-dim": "#cac6c4",
        "on-tertiary-fixed": "#1c1b1a",
        "on-tertiary-fixed-variant": "#484645",
        "error": "#ba1a1a",
        "on-error": "#ffffff",
        "error-container": "#ffdad6",
        "on-error-container": "#93000a",
        "primary-fixed": "#e5e2e1",
        "primary-fixed-dim": "#c8c6c5",
        "on-primary-fixed": "#1c1b1b",
        "on-primary-fixed-variant": "#474746",
        "ink-wash-gray": "#D4CCBC",
        "pine-green": "#2E7D5E",
        "cinnabar-red": "#C0392B",
        "slate-blue": "#2B6CB0",
        "ochre-warning": "#B7610A",
        "pale-ink": "#6B6B6B",
      },
      borderRadius: {
        "DEFAULT": "0.125rem",
        "lg": "0.25rem",
        "xl": "0.5rem",
        "full": "0.75rem"
      },
      spacing: {
        "unit": "8px",
        "container-margin": "24px",
        "section-gap": "40px",
        "gutter": "16px",
        "ink-stroke-thick": "3px",
        "ink-stroke-thin": "1px"
      },
      fontFamily: {
        "headline-lg": ["Noto Serif SC", "serif"],
        "headline-lg-mobile": ["Noto Serif SC", "serif"],
        "headline-md": ["Noto Serif SC", "serif"],
        "body-lg": ["Noto Serif SC", "serif"],
        "body-sm": ["Noto Serif SC", "serif"],
        "number-display": ["Hanken Grotesk", "sans-serif"],
        "number-standard": ["Hanken Grotesk", "sans-serif"],
        "label-caps": ["Hanken Grotesk", "sans-serif"],
      },
      fontSize: {
        "headline-lg": ["28px", {lineHeight: "36px", letterSpacing: "-0.02em", fontWeight: "700"}],
        "headline-lg-mobile": ["24px", {lineHeight: "32px", fontWeight: "700"}],
        "headline-md": ["20px", {lineHeight: "28px", fontWeight: "600"}],
        "body-lg": ["16px", {lineHeight: "24px", fontWeight: "400"}],
        "body-sm": ["13px", {lineHeight: "20px", fontWeight: "400"}],
        "number-display": ["32px", {lineHeight: "40px", letterSpacing: "0.05em", fontWeight: "600"}],
        "number-standard": ["18px", {lineHeight: "24px", fontWeight: "500"}],
        "label-caps": ["11px", {lineHeight: "16px", letterSpacing: "0.1em", fontWeight: "700"}],
      }
    },
  },
}
</script>
<style>
.material-symbols-outlined {
  font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
}
.brush-divider {
  height: 2px;
  background: linear-gradient(90deg, transparent 0%, #D4CCBC 50%, transparent 100%);
  width: 80px;
}
/* 隐藏原生输入框的聚焦边框 */
input:focus { outline: none; }
</style>
</head>
<body class="overflow-hidden" style="background-color:#F5F0E8;font-family:'Noto Serif SC',serif">
<!-- 半透明背景 -->
<div class="fixed inset-0 bg-black/20 backdrop-blur-sm z-40" onclick="closeDrawer()"></div>

<!-- 抽屉主体 -->
<div class="fixed bottom-0 left-0 right-0 z-50 bg-surface-container-lowest rounded-t-[32px] shadow-xl max-h-[90dvh] flex flex-col overflow-hidden animate-slide-up" style="max-width:480px;margin:0 auto;animation:slideUp 0.3s ease-out">

  <!-- 把手 -->
  <div class="w-full flex justify-center py-4">
    <div class="w-12 h-1 bg-ink-wash-gray rounded-full opacity-60"></div>
  </div>

  <!-- 金额显示 -->
  <div class="px-6 pt-4 pb-2 text-center">
    <div class="flex items-center justify-center">
      <span id="amountPrefix" class="font-number-display text-cinnabar-red opacity-60" style="font-size:24px;line-height:1">¥</span>
      <input type="text" id="amountInput" value="0.00" inputmode="decimal" class="font-number-display text-primary bg-transparent text-center w-auto min-w-[120px]" style="font-size:48px;line-height:1" onclick="this.focus()">
    </div>
    <div class="brush-divider mx-auto mt-3"></div>
  </div>

  <!-- 支出/收入切换 -->
  <div class="flex justify-center py-4">
    <div class="relative flex items-center bg-surface-container-low p-1 rounded-full border border-outline-variant/30 w-48">
      <div id="typeIndicator" class="absolute left-1 top-1 bottom-1 w-[calc(50%-4px)] bg-primary rounded-full transition-transform duration-300"></div>
      <button class="relative z-10 flex-1 py-2 text-center" id="btnExpense" onclick="switchType('expense')">
        <span class="font-body-lg text-white font-medium">支出</span>
      </button>
      <button class="relative z-10 flex-1 py-2 text-center" id="btnIncome" onclick="switchType('income')">
        <span class="font-body-lg text-pale-ink">收入</span>
      </button>
    </div>
  </div>

  <!-- 分类选择 -->
  <div class="px-6 pb-4 flex-1 overflow-y-auto">
    <p class="font-label-caps text-label-caps text-pale-ink uppercase text-center mb-3">选择分类</p>
    <div id="categoryGrid" class="grid grid-cols-4 gap-3 text-center">
      <!-- 分类由JS动态渲染 -->
    </div>
  </div>

  <!-- 日期 & 备注 -->
  <div class="px-6">
    <div class="flex items-center gap-4 py-3 border-b border-ink-wash-gray/30">
      <span class="material-symbols-outlined text-pale-ink">calendar_today</span>
      <input type="text" id="dateInput" value="" readonly class="flex-1 bg-transparent border-none p-0 font-body-lg text-body-lg text-primary cursor-pointer" onclick="alert('日期选择器开发中')">
    </div>
    <div class="flex items-center gap-4 py-3 border-b border-ink-wash-gray/30">
      <span class="material-symbols-outlined text-pale-ink">edit_note</span>
      <input type="text" id="noteInput" placeholder="添加备注" class="flex-1 bg-transparent border-none p-0 font-body-lg text-body-lg text-primary placeholder:text-pale-ink focus:outline-none focus:ring-0">
    </div>
  </div>

  <!-- 确认按钮 -->
  <div class="flex justify-center py-6 pb-8">
    <div id="saveBtn" class="w-16 h-16 bg-cinnabar-red rounded-full flex items-center justify-center shadow-lg cursor-pointer hover:scale-105 active:scale-95 transition-transform" onclick="saveRecord()">
      <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none"><path d="M5 12l5 5L19 7" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
  </div>
</div>

<script src="../assets/js/api.js"></script>
<script>
// 支出分类（来自账本管理）
const expenseCategories = [
  { id: 1, name: '餐饮', icon: 'restaurant' },
  { id: 2, name: '交通', icon: 'directions_bus' },
  { id: 3, name: '购物', icon: 'shopping_bag' },
  { id: 4, name: '居住', icon: 'home' },
  { id: 5, name: '娱乐', icon: 'movie' },
  { id: 6, name: '医疗', icon: 'health_and_safety' },
  { id: 7, name: '教育', icon: 'school' },
  { id: 8, name: '人情', icon: 'favorite' },
];

// 收入分类
const incomeCategories = [
  { id: 14, name: '工资', icon: 'payments' },
  { id: 15, name: '奖金', icon: 'redeem' },
  { id: 16, name: '兼职', icon: 'account_balance_wallet' },
  { id: 17, name: '理财', icon: 'trending_up' },
];

let currentType = 'expense';
let selectedCategoryId = 1;

function closeDrawer() {
  window.location.href = 'home.html';
}

function switchType(type) {
  currentType = type;
  const indicator = document.getElementById('typeIndicator');
  const prefix = document.getElementById('amountPrefix');

  if (type === 'income') {
    indicator.style.transform = 'translateX(88px)';
    document.getElementById('btnExpense').querySelector('span').className = 'font-body-lg text-pale-ink';
    document.getElementById('btnIncome').querySelector('span').className = 'font-body-lg text-white font-medium';
    prefix.className = 'font-number-display text-pine-green opacity-60';
    prefix.style.fontSize = '24px';
    prefix.style.lineHeight = '1';
    // 默认选中收入分类的第一个
    selectedCategoryId = incomeCategories[0].id;
  } else {
    indicator.style.transform = 'translateX(0)';
    document.getElementById('btnExpense').querySelector('span').className = 'font-body-lg text-white font-medium';
    document.getElementById('btnIncome').querySelector('span').className = 'font-body-lg text-pale-ink';
    prefix.className = 'font-number-display text-cinnabar-red opacity-60';
    prefix.style.fontSize = '24px';
    prefix.style.lineHeight = '1';
    // 默认选中支出分类的第一个
    selectedCategoryId = expenseCategories[0].id;
  }

  renderCategories();
}

function renderCategories() {
  const grid = document.getElementById('categoryGrid');
  const categories = currentType === 'expense' ? expenseCategories : incomeCategories;

  grid.innerHTML = categories.map(cat => `
    <div class="category-btn flex flex-col items-center gap-1 ${cat.id === selectedCategoryId ? 'selected' : ''}" data-id="${cat.id}" onclick="selectCategory(this, ${cat.id})">
      <div class="w-14 h-14 rounded-full flex items-center justify-center border-2 ${cat.id === selectedCategoryId ? 'border-primary bg-secondary-container' : 'border-ink-wash-gray/40'} transition-all cursor-pointer">
        <span class="material-symbols-outlined text-xl text-primary">${cat.icon}</span>
      </div>
      <span class="font-label-caps text-label-caps text-pale-ink">${cat.name}</span>
    </div>
  `).join('');
}

function selectCategory(el, id) {
  document.querySelectorAll('.category-btn').forEach(b => {
    b.querySelector('div').classList.remove('border-primary', 'bg-secondary-container');
    b.querySelector('div').classList.add('border-ink-wash-gray/40');
  });
  el.querySelector('div').classList.add('border-primary', 'bg-secondary-container');
  el.querySelector('div').classList.remove('border-ink-wash-gray/40');
  selectedCategoryId = id;
}

async function saveRecord() {
  const amountStr = document.getElementById('amountInput').value;
  const amount = parseFloat(amountStr);

  if (!amount || amount <= 0) {
    alert('请输入有效金额');
    return;
  }

  const note = document.getElementById('noteInput').value;
  const dateInput = document.getElementById('dateInput').value;

  // 禁用保存按钮
  const saveBtn = document.getElementById('saveBtn');
  saveBtn.style.opacity = '0.5';
  saveBtn.style.pointerEvents = 'none';

  try {
    const res = await API.record.createRecord({
      categoryId: selectedCategoryId,
      type: currentType === 'expense' ? 1 : 2,
      amount: amount,
      note: note
    });

    if (res.code === 0) {
      window.location.href = 'home.html';
    } else {
      alert(res.message || '保存失败');
      saveBtn.style.opacity = '1';
      saveBtn.style.pointerEvents = 'auto';
    }
  } catch (e) {
    alert('保存失败: ' + e.message);
    saveBtn.style.opacity = '1';
    saveBtn.style.pointerEvents = 'auto';
  }
}

// 初始化
document.addEventListener('DOMContentLoaded', async function() {
  // 检查登录状态
  if (!TokenStorage.get()) {
    window.location.href = 'login.html';
    return;
  }

  // 初始化日期
  const now = new Date();
  const dateStr = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  document.getElementById('dateInput').value = dateStr;

  // 渲染分类
  renderCategories();
});

// 金额输入处理
document.getElementById('amountInput').addEventListener('input', function(e) {
  let value = e.target.value.replace(/[^\d.]/g, '');
  // 确保只有一个小数点
  const parts = value.split('.');
  if (parts.length > 2) {
    value = parts[0] + '.' + parts.slice(1).join('');
  }
  // 限制小数位数为2位
  if (parts[1] && parts[1].length > 2) {
    value = parts[0] + '.' + parts[1].slice(0, 2);
  }
  e.target.value = value;
});
</script>

<style>
@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}
</style>
</body>
</html>
