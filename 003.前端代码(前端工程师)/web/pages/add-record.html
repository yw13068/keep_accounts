<style>
.material-symbols-outlined {
  font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
}
.brush-divider {
  height: 2px;
  background: linear-gradient(90deg, transparent 0%, #D4CCBC 50%, transparent 100%);
  width: 80px;

</style>
</head>
<body class="overflow-hidden" style="background-color:#F5F0E8;font-family:'Noto Serif SC',serif">
<!-- 半透明背景 -->
<div class="fixed inset-0 bg-black/20 backdrop-blur-sm z-40" onclick="closeDrawer()"></div>

<!-- 抽屉主体 -->
<div class="fixed bottom-0 left-0 right-0 z-50 bg-surface-container-lowest rounded-t-[32px] shadow-xl max-h-[90dvh] flex flex-col overflow-hidden animate-slide-up" style="max-width:480px;margin:0 auto;animation:slideUp 0.3s ease-out">
<!-- 把手 -->
<div class="w-full flex justify-center py-4">
<div class="w-12 h-1 bg-ink-wash-gray rounded-full opacity-60"></div>
</div>

<!-- 金额显示 -->
<div class="px-6 pt-4 pb-2 text-center">
<div class="flex items-start justify-center gap-1">
<span id="amountPrefix" class="font-number-display text-cinnabar-red opacity-60" style="font-size:32px;line-height:1.2">¥</span>
<span id="amountDisplay" class="font-number-display text-primary" style="font-size:56px;line-height:1">0.00</span>
</div>
<div class="brush-divider mx-auto mt-3"></div>
</div>

<!-- 支出/收入切换 -->
<div class="flex justify-center py-4">
<div class="relative flex items-center bg-surface-container-low p-1 rounded-full border border-outline-variant/30 w-48">
<div id="typeIndicator" class="absolute left-1 top-1 bottom-1 w-[calc(50%-4px)] bg-primary rounded-full transition-transform duration-300"></div>
<button class="relative z-10 flex-1 py-2 text-center" id="btnExpense" onclick="switchType('expense')">
<span class="font-body-lg text-white font-medium">支出</span>
</button>
<button class="relative z-10 flex-1 py-2 text-center" id="btnIncome" onclick="switchType('income')">
<span class="font-body-lg text-pale-ink">收入</span>
</button>
</div>
</div>

<!-- 分类选择 -->
<div class="px-6 pb-4">
<p class="font-label-caps text-label-caps text-pale-ink uppercase text-center mb-3">选择分类</p>
<div class="grid grid-cols-4 gap-3 text-center">
<div class="category-btn selected flex flex-col items-center gap-1" data-category="餐饮" onclick="selectCategory(this)">
<div class="w-14 h-14 rounded-full bg-surface-container-low flex items-center justify-center border border-ink-wash-gray/40 selected:border-primary selected:bg-secondary-container transition-all cursor-pointer">
<span class="material-symbols-outlined text-xl text-primary">restaurant</span>
</div>
<span class="font-label-caps text-label-caps text-pale-ink">餐饮</span>
</div>
<div class="category-btn flex flex-col items-center gap-1" data-category="交通" onclick="selectCategory(this)">
<div class="w-14 h-14 rounded-full bg-surface-container-low flex items-center justify-center border border-ink-wash-gray/40 hover:border-primary hover:bg-secondary-container transition-all cursor-pointer">
<span class="material-symbols-outlined text-xl text-primary">directions_bus</span>
</div>
<span class="font-label-caps text-label-caps text-pale-ink">交通</span>
</div>
<div class="category-btn flex flex-col items-center gap-1" data-category="购物" onclick="selectCategory(this)">
<div class="w-14 h-14 rounded-full bg-surface-container-low flex items-center justify-center border border-ink-wash-gray/40 hover:border-primary hover:bg-secondary-container transition-all cursor-pointer">
<span class="material-symbols-outlined text-xl text-primary">shopping_bag</span>
</div>
<span class="font-label-caps text-label-caps text-pale-ink">购物</span>
</div>
<div class="category-btn flex flex-col items-center gap-1" data-category="居住" onclick="selectCategory(this)">
<div class="w-14 h-14 rounded-full bg-surface-container-low flex items-center justify-center border border-ink-wash-gray/40 hover:border-primary hover:bg-secondary-container transition-all cursor-pointer">
<span class="material-symbols-outlined text-xl text-primary">home</span>
</div>
<span class="font-label-caps text-label-caps text-pale-ink">居住</span>
</div>
<div class="category-btn flex flex-col items-center gap-1" data-category="娱乐" onclick="selectCategory(this)">
<div class="w-14 h-14 rounded-full bg-surface-container-low flex items-center justify-center border border-ink-wash-gray/40 hover:border-primary hover:bg-secondary-container transition-all cursor-pointer">
<span class="material-symbols-outlined text-xl text-primary">movie</span>
</div>
<span class="font-label-caps text-label-caps text-pale-ink">娱乐</span>
</div>
<div class="category-btn flex flex-col items-center gap-1" data-category="医疗" onclick="selectCategory(this)">
<div class="w-14 h-14 rounded-full bg-surface-container-low flex items-center justify-center border border-ink-wash-gray/40 hover:border-primary hover:bg-secondary-container transition-all cursor-pointer">
<span class="material-symbols-outlined text-xl text-primary">health_and_safety</span>
</div>
<span class="font-label-caps text-label-caps text-pale-ink">医疗</span>
</div>
<div class="category-btn flex flex-col items-center gap-1" data-category="教育" onclick="selectCategory(this)">
<div class="w-14 h-14 rounded-full bg-surface-container-low flex items-center justify-center border border-ink-wash-gray/40 hover:border-primary hover:bg-secondary-container transition-all cursor-pointer">
<span class="material-symbols-outlined text-xl text-primary">school</span>
</div>
<span class="font-label-caps text-label-caps text-pale-ink">教育</span>
</div>
<div class="category-btn flex flex-col items-center gap-1" data-category="其他" onclick="selectCategory(this)">
<div class="w-14 h-14 rounded-full bg-surface-container-low flex items-center justify-center border border-ink-wash-gray/40 hover:border-primary hover:bg-secondary-container transition-all cursor-pointer">
<span class="material-symbols-outlined text-xl text-primary">more_horiz</span>
</div>
<span class="font-label-caps text-label-caps text-pale-ink">其他</span>
</div>
</div>
</div>

<!-- 日期 & 备注 -->
<div class="px-6">
<div class="flex items-center gap-4 py-3 border-b border-ink-wash-gray/30">
<span class="material-symbols-outlined text-pale-ink">calendar_today</span>
<input type="text" id="dateInput" value="2024年8月24日 · 16:30" readonly class="flex-1 bg-transparent border-none p-0 font-body-lg text-body-lg text-primary cursor-pointer" onclick="alert('日期选择器开发中')">
</div>
<div class="flex items-center gap-4 py-3 border-b border-ink-wash-gray/30">
<span class="material-symbols-outlined text-pale-ink">edit_note</span>
<input type="text" id="noteInput" placeholder="添加备注（如：午餐...）" class="flex-1 bg-transparent border-none p-0 font-body-lg text-body-lg text-primary placeholder:text-pale-ink focus:outline-none">
</div>
</div>

<!-- 数字键盘 -->
<div class="px-4 pb-8 flex flex-col gap-2">
<div class="flex gap-2">
<div class="keypad-btn flex-1 h-14 flex items-center justify-center font-number-standard text-primary bg-surface-container-lowest rounded-lg cursor-pointer hover:bg-surface-container-low active:scale-95 transition-transform select-none" onclick="addDigit('1')">1</div>
<div class="keypad-btn flex-1 h-14 flex items-center justify-center font-number-standard text-primary bg-surface-container-lowest rounded-lg cursor-pointer hover:bg-surface-container-low active:scale-95 transition-transform select-none" onclick="addDigit('2')">2</div>
<div class="keypad-btn flex-1 h-14 flex items-center justify-center font-number-standard text-primary bg-surface-container-lowest rounded-lg cursor-pointer hover:bg-surface-container-low active:scale-95 transition-transform select-none" onclick="addDigit('3')">3</div>
</div>
<div class="flex gap-2">
<div class="keypad-btn flex-1 h-14 flex items-center justify-center font-number-standard text-primary bg-surface-container-lowest rounded-lg cursor-pointer hover:bg-surface-container-low active:scale-95 transition-transform select-none" onclick="addDigit('4')">4</div>
<div class="keypad-btn flex-1 h-14 flex items-center justify-center font-number-standard text-primary bg-surface-container-lowest rounded-lg cursor-pointer hover:bg-surface-container-low active:scale-95 transition-transform select-none" onclick="addDigit('5')">5</div>
<div class="keypad-btn flex-1 h-14 flex items-center justify-center font-number-standard text-primary bg-surface-container-lowest rounded-lg cursor-pointer hover:bg-surface-container-low active:scale-95 transition-transform select-none" onclick="addDigit('6')">6</div>
</div>
<div class="flex gap-2">
<div class="keypad-btn flex-1 h-14 flex items-center justify-center font-number-standard text-primary bg-surface-container-lowest rounded-lg cursor-pointer hover:bg-surface-container-low active:scale-95 transition-transform select-none" onclick="addDigit('7')">7</div>
<div class="keypad-btn flex-1 h-14 flex items-center justify-center font-number-standard text-primary bg-surface-container-lowest rounded-lg cursor-pointer hover:bg-surface-container-low active:scale-95 transition-transform select-none" onclick="addDigit('8')">8</div>
<div class="keypad-btn flex-1 h-14 flex items-center justify-center font-number-standard text-primary bg-surface-container-lowest rounded-lg cursor-pointer hover:bg-surface-container-low active:scale-95 transition-transform select-none" onclick="addDigit('9')">9</div>
</div>
<div class="flex gap-2">
<div class="keypad-btn flex-1 h-14 flex items-center justify-center font-number-standard text-primary bg-surface-container-lowest rounded-lg cursor-pointer hover:bg-surface-container-low active:scale-95 transition-transform select-none" onclick="addDigit('.')">.</div>
<div class="keypad-btn flex-1 h-14 flex items-center justify-center font-number-standard text-primary bg-surface-container-lowest rounded-lg cursor-pointer hover:bg-surface-container-low active:scale-95 transition-transform select-none" onclick="addDigit('0')">0</div>
<div class="keypad-btn flex-1 h-14 flex items-center justify-center bg-surface-container-lowest rounded-lg cursor-pointer hover:bg-surface-container-low active:scale-95 transition-transform" onclick="backspace()">
<svg width="20" height="14" viewBox="0 0 20 14" fill="none"><path d="M1 7s3-6 9-6 9 6 9 6-9 6-9 6-9-6-9-6z" stroke="#1c1b1b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 7l4 4M18 7l-4 4" stroke="#1c1b1b" stroke-width="1.5" stroke-linecap="round"/></svg>
</div>
</div>
<!-- 确认按钮 -->
<div class="flex justify-center pt-4">
<div class="w-16 h-16 bg-cinnabar-red rounded-full flex items-center justify-center shadow-lg cursor-pointer hover:scale-105 active:scale-95 transition-transform" onclick="saveRecord()">
<svg class="w-6 h-6" viewBox="0 0 24 24" fill="none"><path d="M5 12l5 5L19 7" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
</div>
</div>
</div>
</div>

<script>
let currentAmount = '0';
let currentType = 'expense';
let selectedCategory = '餐饮';

function closeDrawer() {
  window.location.href = 'home.html';
}

function switchType(type) {
  currentType = type;
  const indicator = document.getElementById('typeIndicator');
  const prefix = document.getElementById('amountPrefix');
  if (type === 'income') {
    indicator.style.transform = 'translateX(88px)';
    document.getElementById('btnExpense').querySelector('span').className = 'font-body-lg text-pale-ink';
    document.getElementById('btnIncome').querySelector('span').className = 'font-body-lg text-white font-medium';
    prefix.className = 'font-number-display text-pine-green opacity-60';
    prefix.style.fontSize = '32px';
    prefix.style.lineHeight = '1.2';
  } else {
    indicator.style.transform = 'translateX(0)';
    document.getElementById('btnExpense').querySelector('span').className = 'font-body-lg text-white font-medium';
    document.getElementById('btnIncome').querySelector('span').className = 'font-body-lg text-pale-ink';
    prefix.className = 'font-number-display text-cinnabar-red opacity-60';
    prefix.style.fontSize = '32px';
    prefix.style.lineHeight = '1.2';
  }
}

function selectCategory(el) {
  document.querySelectorAll('.category-btn').forEach(b => {
    b.querySelector('div').classList.remove('border-primary', 'bg-secondary-container');
    b.querySelector('div').classList.add('border-ink-wash-gray/40');
  });
  el.querySelector('div').classList.add('border-primary', 'bg-secondary-container');
  el.querySelector('div').classList.remove('border-ink-wash-gray/40');
  selectedCategory = el.dataset.category;
}

function addDigit(digit) {
  if (currentAmount === '0' && digit !== '.') {
    currentAmount = digit;
  } else if (digit === '.' && currentAmount.includes('.')) {
    return;
  } else if (currentAmount.length < 10) {
    currentAmount += digit;
  }
  updateDisplay();
}

function backspace() {
  if (currentAmount.length === 1) {
    currentAmount = '0';
  } else {
    currentAmount = currentAmount.slice(0, -1);
  }
  updateDisplay();
}

function updateDisplay() {
  let display = currentAmount;
  if (!currentAmount.includes('.')) {
    display = currentAmount + '.00';
  } else if (currentAmount.endsWith('.')) {
    display = currentAmount + '00';
  } else if (currentAmount.split('.')[1].length === 1) {
    display = currentAmount + '0';
  }
  document.getElementById('amountDisplay').textContent = display;
}

function saveRecord() {
  if (currentAmount === '0' || currentAmount === '0.' || currentAmount === '') {
    alert('请输入金额');
    return;
  }
  const amount = parseFloat(currentAmount).toFixed(2);
  const note = document.getElementById('noteInput').value;
  const prefix = currentType === 'income' ? '+' : '-';
  alert(`${prefix}¥${amount} · ${selectedCategory}${note ? ' · ' + note : ''}\n\n记录已保存！`);
  window.location.href = 'home.html';
}

// 初始化日期为当前时间
const now = new Date();
const dateStr = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 · ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
document.getElementById('dateInput').value = dateStr;
</script>

<style>
@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}
</style>
</body>
</html>
