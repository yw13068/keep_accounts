<body class="min-h-dvh" style="background-color:#F5F0E8;font-family:'Noto Serif SC',serif">
<!-- Top App Bar -->
<header class="sticky top-0 z-30 bg-surface/90 backdrop-blur-md flex items-center justify-center h-16">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-widest">留白记账</h1>
</header>

<main class="max-w-md mx-auto px-container-margin py-6 pb-32 flex flex-col gap-8">
<!-- 月份选择 -->
<div class="flex items-center justify-center py-2">
<button class="flex items-center gap-2 px-4 py-2 rounded-lg hover:bg-surface-container-low transition-colors">
<span class="font-body-lg text-body-lg text-primary">2024年8月</span>
<svg class="w-2 h-2" viewBox="0 0 8 5" fill="none"><path d="M1 1l3 3 3-3" stroke="#1c1b1b" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
</button>
</div>

<!-- 支出/收入切换 -->
<div class="flex justify-center">
<div class="relative flex items-center bg-surface-container-low p-1 rounded-full border border-outline-variant/30 w-48">
<div id="toggleInd" class="absolute left-1 top-1 bottom-1 w-[calc(50%-4px)] bg-primary rounded-full transition-transform duration-300"></div>
<button class="relative z-10 flex-1 py-2 text-center" id="btnExp" onclick="sw('exp')">
<span class="font-body-lg text-white font-medium">支出</span>
</button>
<button class="relative z-10 flex-1 py-2 text-center" id="btnInc" onclick="sw('inc')">
<span class="font-body-lg text-pale-ink">收入</span>
</button>
</div>
</div>

<!-- 环形图卡片 -->
<div class="bg-surface-container-lowest rounded-xl p-6 relative overflow-hidden flex flex-col items-center" style="height:400px">
<p class="absolute top-6 font-label-caps text-label-caps text-pale-ink uppercase">本月洞察</p>
<!-- Donut Chart -->
<div class="absolute top-16 left-1/2 -translate-x-1/2" style="width:220px;height:220px">
<svg width="220" height="220" viewBox="0 0 220 220" fill="none" style="transform:rotate(-90deg)">
<circle cx="110" cy="110" r="83.6" stroke="#e5e2e1" stroke-width="26.4" fill="none"/>
<circle cx="110" cy="110" r="83.6" stroke="#1c1b1b" stroke-width="26.4" fill="none" stroke-dasharray="220.8 525.3" stroke-linecap="round"/>
<circle cx="110" cy="110" r="83.6" stroke="#2B6CB0" stroke-width="26.4" fill="none" stroke-dasharray="131.3 525.3" stroke-dashoffset="-220.8" stroke-linecap="round"/>
<circle cx="110" cy="110" r="83.6" stroke="#C0392B" stroke-width="26.4" fill="none" stroke-dasharray="84 525.3" stroke-dashoffset="-352.1" stroke-linecap="round"/>
<circle cx="110" cy="110" r="83.6" stroke="#2E7D5E" stroke-width="26.4" fill="none" stroke-dasharray="89.3 525.3" stroke-dashoffset="-436.1" stroke-linecap="round"/>
<circle cx="110" cy="110" r="70.4" fill="#ffffff"/>
</svg>
<div class="absolute inset-0 flex flex-col items-center justify-center gap-1">
<p class="font-label-caps text-label-caps text-pale-ink text-center">本月支出</p>
<p class="font-number-display text-number-display text-primary">¥4,280</p>
</div>
</div>
<!-- Legend -->
<div class="absolute left-6 right-6 bottom-6 grid grid-cols-2 gap-4">
<div class="flex items-center gap-3"><div class="w-3 h-3 rounded-full bg-primary flex-shrink-0"></div><span class="font-body-sm text-primary">居住 (42%)</span></div>
<div class="flex items-center gap-3"><div class="w-3 h-3 rounded-full bg-slate-blue flex-shrink-0"></div><span class="font-body-sm text-primary">健康 (25%)</span></div>
<div class="flex items-center gap-3"><div class="w-3 h-3 rounded-full bg-cinnabar-red flex-shrink-0"></div><span class="font-body-sm text-primary">餐饮 (16%)</span></div>
<div class="flex items-center gap-3"><div class="w-3 h-3 rounded-full bg-pine-green flex-shrink-0"></div><span class="font-body-sm text-primary">休闲 (17%)</span></div>
</div>
</div>

<!-- 支出排行 -->
<div class="flex flex-col gap-6">
<h2 class="font-headline-md text-headline-md text-primary pl-4">支出排行</h2>
<div class="flex flex-col gap-6">

<div class="flex flex-col gap-2">
<div class="flex justify-between items-center">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-pale-ink">home</span>
<span class="font-body-lg text-primary font-medium">每月房租</span>
</div>
<span class="font-number-standard text-primary">¥1,800.00</span>
</div>
<div class="h-1.5 bg-surface-container-high rounded-full overflow-hidden"><div class="h-full bg-primary rounded-full" style="width:42%"></div></div>
</div>

<div class="h-px bg-gradient-to-r from-transparent via-ink-wash-gray to-transparent opacity-30"></div>

<div class="flex flex-col gap-2">
<div class="flex justify-between items-center">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-pale-ink">local_cafe</span>
<span class="font-body-lg text-primary font-medium">茶馆雅座</span>
</div>
<span class="font-number-standard text-primary">¥680.00</span>
</div>
<div class="h-1.5 bg-surface-container-high rounded-full overflow-hidden"><div class="h-full bg-primary rounded-full" style="width:15.9%"></div></div>
</div>

<div class="h-px bg-gradient-to-r from-transparent via-ink-wash-gray to-transparent opacity-30"></div>

<div class="flex flex-col gap-2">
<div class="flex justify-between items-center">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-pale-ink">brush</span>
<span class="font-body-lg text-primary font-medium">书法课</span>
</div>
<span class="font-number-standard text-primary">¥420.00</span>
</div>
<div class="h-1.5 bg-surface-container-high rounded-full overflow-hidden"><div class="h-full bg-primary rounded-full" style="width:9.8%"></div></div>
</div>

</div>
</div>

<!-- 引言 -->
<p class="text-center font-body-sm text-pale-ink pt-12 opacity-60 italic">"平衡并非寻得，而是由你创造。"</p>

<!-- FAB -->
<a href="add-record.html" class="fixed bottom-24 right-6 w-14 h-14 bg-cinnabar-red rounded-xl flex items-center justify-center shadow-lg hover:scale-105 active:scale-95 transition-transform z-40">
<svg class="w-4 h-4" viewBox="0 0 15.7 15.7" fill="none"><path d="M7.85 1.05v13.6M1.05 7.85h13.6" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
</a>

<nav class="fixed bottom-0 left-0 right-0 z-50 bg-surface-container-lowest flex justify-around items-center h-16 border-t" style="border-color:rgba(212,204,188,0.3);box-shadow:0 -2px 5px rgba(26,26,26,0.05)">
<a class="flex flex-col items-center justify-center py-2 px-4 rounded-xl" href="home.html">
<span class="material-symbols-outlined text-pale-ink">home</span>
<span class="font-label-caps text-label-caps mt-1 text-pale-ink">首页</span>

<a class="flex flex-col items-center justify-center py-2 px-4 rounded-xl bg-surface-container-high" href="stats.html">
<span class="material-symbols-outlined text-primary">analytics</span>
<span class="font-label-caps text-label-caps mt-1" style="color:#1c1b1b">统计</span>
</a>
<a class="flex flex-col items-center justify-center py-2 px-4 rounded-xl" href="budget.html">
<span class="material-symbols-outlined text-pale-ink">calendar_today</span>
<span class="font-label-caps text-label-caps mt-1 text-pale-ink">预算</span>

<a class="flex flex-col items-center justify-center py-2 px-4 rounded-xl" href="profile.html">
<span class="material-symbols-outlined text-pale-ink">person</span>
<span class="font-label-caps text-label-caps mt-1 text-pale-ink">我的</span>
</a>
</nav>

<script>
function sw(type) {
  const ind = document.getElementById('toggleInd');
  if (type === 'inc') {
    ind.style.transform = 'translateX(88px)';
    document.getElementById('btnExp').querySelector('span').className = 'font-body-lg text-pale-ink';
    document.getElementById('btnInc').querySelector('span').className = 'font-body-lg text-white font-medium';
  } else {
    ind.style.transform = 'translateX(0)';
    document.getElementById('btnExp').querySelector('span').className = 'font-body-lg text-white font-medium';
    document.getElementById('btnInc').querySelector('span').className = 'font-body-lg text-pale-ink';
  }
}
</script>
</body>
</html>
